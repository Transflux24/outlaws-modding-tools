[General]
Enabled=true
ExactBuildOnly=true
StartupDelayMs=500

[Session]
; Give each capture a descriptive label.
TestLabel=first_capture
; Writes snapshots at observer ready, capture start/stop, and each F9 marker.
AutomaticSnapshots=true

[Capture]
CaptureOnStart=false
MaxEvents=250000
RawEvaluatorCalls=false
; Enable to include raw interaction-evaluator calls.
InteractionEvaluatorCalls=false
; Compare context fields before and after one evaluator call.
InteractionTransitionDetails=false
; Include caller and callback details on changes between evaluations.
InteractionObservedStateDetails=false
ConsumerTrace=false
ConsumerTraceWindowMs=60
MaxConsumerEvents=25000
; Enables the opt-in F5 hardware data-watch diagnostic for matched couch UID
; components. The watch is never armed automatically without an F5 request.
CouchUidWatch=false

[DiagnosticGates]
HasDealtDamage=false
Fatal=false

[Display]
OverlayNotifications=true
AudioMarker=true

[Hooks]
Factories=true
PlayerAimTarget=true
DamageDealt=true
IsHostile=true
Graphics=true
InteractionLifecycle=true
InteractionCallbacks=true
; Traces only calls to the shared graph helper from the two verified Nix-bowl
; open/close return addresses. All other callers pass through without logging.
NixBowlGraphDispatch=false
; Enable graph dispatch above to repeat the historical zero-call test.
NixBowlInnerEvaluator=false
UIExecutionState=false
; Tracks HC_UI:MenuGraphStack_OnDemand construction. Its evaluator trace is
; filtered to the exact menu_contracts_terminal.muigraph path at object +0x38.
MenuGraphStackOnDemand=false
; Aggregates UI:SetExecutionState activity only after the filtered contracts
; OnDemand evaluator arms the diagnostic window.
UISetExecutionState=false
; Samples only state IDs 38 and 13 in the native manager's current/pending
; bitsets after the contracts OnDemand gate has armed the diagnostic window.
UIExecutionStateManager=false
; Read-only trace of HC_SequenceBlockComponent_LevelEntity's exact-build UID
; archive paths. During F8 capture it records the 16-byte UID at object +0x18.
SequenceLevelEntity=false
; Filtered outer sequence-block collection load used only when the nested
; level-entity archive observes the verified Trailblazer couch UID.
SequenceBlockCollectionLoad=false
; Filtered concrete Target Track archive routine. It records the finalized block
; and third context argument only when its nested component load observes the
; verified Trailblazer couch UID.
TargetTrackFromArchive=false
